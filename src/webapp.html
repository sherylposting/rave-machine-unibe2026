<!-- fetches the data in JSON format from localhost:8000/latest -->

<!-- instructions:
 cd to the folder containing this .html script
 run in cli: python -m http.server 5500
 in browser go to: http://localhost:5500/rave_machine.html
-->

<!doctype html>
<html>
<head>
  <title>Rave Machine</title>
</head>

    <body>

    <h1>Rave Machine</h1>

    <button onclick="startAudio()">Start Audio</button>

    <div>Sensor values: <span id="sensor_value">waiting...</span></div>

    <div>Sound values: <span id="sound_value">waiting...</span></div>

    <script>
    let audioCtx;
    let osc;
    let started = false;
    let beepStarted = false;
    let bpm = 120;
    let freq = 240;
    let nextTime = 0;

    function initAudio() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function schedulebeep(time, input_freq) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(input_freq, time);

        gain.gain.setValueAtTime(0.8, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.2);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(time);
        osc.stop(time + 0.2);
    }

    function playbeeps() {
        if (beepStarted) return;
        beepStarted = true;

        nextTime = audioCtx.currentTime;
        beepLoop();
    }

    function beepLoop() {
        const interval = 60 / bpm;

        while (nextTime < audioCtx.currentTime + 0.1) {
            schedulebeep(nextTime, freq);
            schedulebeep(nextTime+interval, freq*1.2);
            schedulebeep(nextTime+2*interval, freq*1.333);
            schedulebeep(nextTime+3*interval, freq*1.5);
            nextTime += interval*4;
    }

    requestAnimationFrame(beepLoop);
    }

    function startAudio() {
        if (started) return;
        started = true;

        initAudio();
        audioCtx.resume();

        playbeeps();
    }

    async function update() {
        if (!started) return;

        try {
            const response = await fetch("http://localhost:8000/latest");
            const data = await response.json();

            // ---------- SENSOR AXES ----------
            const x = data.acc_x;
            const y = data.acc_y;

            // ---------- SOUND CONTROL ----------
            // map acc_x -> frequency
            freq = 100 + x * 60;

            // map accY -> bpm
            bpm = Math.max(500, Math.abs(y)*700);

            // ---------- DISPLAY VALUES ----------
            document.getElementById("sensor_value").textContent =
            `accX: ${x.toFixed(2)} | accY: ${y.toFixed(2)}`;

            document.getElementById("sound_value").textContent =
            `freq: ${freq.toFixed(2)} | bpm: ${bpm.toFixed(2)}`;

        } catch (err) {
            console.log("Fetch error:", err);
        }
    }

    setInterval(update, 50);

    </script>

    </body>
</html>
