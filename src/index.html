<!-- 
    uses the native Web Audio API to play a looping arpeggiator.
    fetches the sensor data in JSON format from localhost:8000/latest (http GET)
    acc_x values control the beep frequency / pitch, acc_y values control the bpm
-->

<!-- instructions:
    1 - cd to the folder containing this .html script
    2 - run in terminal: python -m http.server 5500 (yes http.server with the dot!)
    3 - in browser go to: http://localhost:5500
-->

<!doctype html>
<html>
<head>
  <title>Rave Machine</title>
  <style>
    body {
        color:white;
        background-color:black;
    }
  </style>
</head>

    <body>

    <h1>Rave Machine</h1>

    <button onclick="startAudio()">Start Audio</button>

    <div>Sensor values: <span id="sensor_value">waiting...</span></div>

    <div>Sound values: <span id="sound_value">waiting...</span></div>

    <script>
    let audioCtx;
    let started = false;
    let bpm = 120;
    let freq = 240;
    let nextTime = 0;
    let colorIndex = 0;
    const colors = ['#F22388', '#0BC21C', '#138ADB', '#F2DC29'];

    // ---- FUNCTION DEFINITIONS ---- //

    function scheduleBeep(time, input_freq) {
        // creates one single beep sound
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(input_freq, time);

        gain.gain.setValueAtTime(0.8, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.2);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        // each note is 0.2 in length
        osc.start(time);
        osc.stop(time + 0.2);
    }

    function beepLoop() {
        // play the arpeggio
        const interval = 60 / bpm;

        // iterate through each note in the sequence (ratios)
        const notes = [1.000, 1.200, 1.333, 1.500];

        while (nextTime < audioCtx.currentTime + 0.1) {
            for (const note of notes) {
                scheduleBeep(nextTime, freq * note);
                nextTime += interval; // move forward one interval before beginning the next note
            }
        }

    requestAnimationFrame(beepLoop); // create a repeated loop
    }

    function startAudio() {
        if (started) return;
        started = true;
        
        // init the audio API
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        audioCtx.resume();

        // start the beep loops
        nextTime = audioCtx.currentTime;
        beepLoop();

        setInterval(() => {
            document.body.style.backgroundColor = colors[colorIndex % colors.length]
            colorIndex++;
        }, 800);
    }

    // ---- MAIN UPDATE LOOP ---- //

    async function update() {
        if (!started) return;

        try {
            // http GET request to retrieve the data in JSON format
            const response = await fetch("http://localhost:8000/latest");
            const data = await response.json();

            // ---------- SENSOR AXES ----------
            const x = data.acc_x;
            const y = data.acc_y;

            // ---------- SOUND CONTROL ----------
            // map acc_x -> frequency
            freq = 100 + x * 200;

            // map accY -> bpm
            bpm = 500 + Math.abs(y)*700;

            // ---------- DISPLAY VALUES ----------
            document.getElementById("sensor_value").textContent =
            `accX: ${x.toFixed(2)} | accY: ${y.toFixed(2)}`;

            document.getElementById("sound_value").textContent =
            `freq: ${freq.toFixed(2)} | bpm: ${bpm.toFixed(2)}`;

        } catch (err) {
            console.log("Fetch error:", err);
        }
    }

    // repeatedly update at an interval of 50
    setInterval(update, 50);

    </script>

    </body>
</html>
